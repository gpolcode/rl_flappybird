<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Hackathon: Human vs Trained RL Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #4ec0ca; /* Matches the sky to hide mobile over-scroll smoothly */
        display: flex;
        justify-content: center;
        align-items: center; /* Centers the game on desktop */
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
      }

      canvas {
        display: block;
        height: 100vh; /* Fill the screen vertically */
        width: auto; /* Scale width proportionally */
        max-width: 100vw; /* Prevent horizontal overflow on extremely thin devices */
        image-rendering: pixelated;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.4); /* Arcade cabinet border effect for desktop */
      }

      #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px 0 #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loader">Loading RL Brain...</div>
    <canvas id="gameCanvas"></canvas>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const loader = document.getElementById("loader");

      // --- VIEWPORT DECOUPLING (THE FIX) ---
      const BACKEND_WIDTH = 288;
      const GYM_HEIGHT = 512; // Strictly preserved for ONNX State Inputs and Physics Collision

      // Check if device is portrait (Mobile) or landscape (Desktop)
      const isMobile = window.innerHeight > window.innerWidth;
      // Extend the visual canvas height on mobile to fill the screen, lock to 512 on desktop
      const VISUAL_HEIGHT = isMobile
        ? Math.max(
            GYM_HEIGHT,
            BACKEND_WIDTH * (window.innerHeight / window.innerWidth)
          )
        : GYM_HEIGHT;

      const RESOLUTION_SCALE = 4;
      canvas.width = BACKEND_WIDTH * RESOLUTION_SCALE;
      canvas.height = VISUAL_HEIGHT * RESOLUTION_SCALE;
      ctx.scale(RESOLUTION_SCALE, RESOLUTION_SCALE);
      ctx.imageSmoothingEnabled = false;

      // --- EXACT GYMNASIUM PHYSICS CONSTANTS ---
      const GRAVITY = 1.0;
      const FLAP_IMPULSE = -9.0;
      const MAX_VELOCITY = 10.0;
      const MIN_VELOCITY = -8.0;
      const PIPE_SPEED = 4.0;
      const PIPE_SPAWN_DIST = 144;
      const GAP_SIZE = 100;
      const PIPE_WIDTH = 52;
      const BIRD_X = 57;

      // --- ASSET LOADING ---
      const bgImg = new Image();
      bgImg.src = "assets/background-day.png";
      const pipeImg = new Image();
      pipeImg.src = "assets/pipe-green.png";
      const baseImg = new Image();
      baseImg.src = "assets/base.png";

      function loadBirdFrames(color) {
        const down = new Image();
        down.src = `assets/${color}bird-downflap.png`;
        const mid = new Image();
        mid.src = `assets/${color}bird-midflap.png`;
        const up = new Image();
        up.src = `assets/${color}bird-upflap.png`;
        return [down, mid, up, mid];
      }

      const yellowBirdFrames = loadBirdFrames("yellow");
      const blueBirdFrames = loadBirdFrames("blue");

      let session = null;
      let gameFrame = 0;
      let score = 0;
      let pipes = [];
      let gameState = "LOADING";

      let humanBird = { y: 240, velocity: 0, dead: false };
      let aiBird = { y: 240, velocity: 0, dead: false };

      async function initAI() {
        try {
          session = await ort.InferenceSession.create(
            "./flappy_bird_packed.onnx"
          );
          loader.style.display = "none";
          gameState = "START";
          resetGame();
          requestAnimationFrame(gameLoop);
        } catch (e) {
          loader.innerText = "Error loading flappy_bird_packed.onnx";
          console.error("ONNX Runtime Error:", e);
        }
      }

      function resetGame() {
        score = 0;
        pipes = [];
        humanBird = { y: 240, velocity: 0, dead: false };
        aiBird = { y: 240, velocity: 0, dead: false };
        spawnPipePair(BACKEND_WIDTH + 100);
      }

      function spawnPipePair(startX) {
        let topHeight = Math.random() * (GYM_HEIGHT - GAP_SIZE - 160) + 60;
        pipes.push({
          x: startX,
          top: topHeight,
          bottom: topHeight + GAP_SIZE,
          passed: false
        });
      }

      async function gameLoop() {
        ctx.clearRect(0, 0, BACKEND_WIDTH, VISUAL_HEIGHT);
        // Draw sky anchored to the top
        ctx.drawImage(bgImg, 0, 0, BACKEND_WIDTH, GYM_HEIGHT);

        if (gameState === "PLAYING") {
          let anyAlive = !humanBird.dead || !aiBird.dead;

          [humanBird, aiBird].forEach((bird) => {
            if (!bird.dead) {
              bird.velocity += GRAVITY;
              if (bird.velocity > MAX_VELOCITY) bird.velocity = MAX_VELOCITY;
              if (bird.velocity < MIN_VELOCITY) bird.velocity = MIN_VELOCITY;
              bird.y += bird.velocity;
              checkCollision(bird);
            } else if (bird.y < GYM_HEIGHT - 50 - 12) {
              bird.velocity += GRAVITY;
              if (bird.velocity > MAX_VELOCITY) bird.velocity = MAX_VELOCITY;
              bird.y += bird.velocity;
              if (bird.y > GYM_HEIGHT - 50 - 12) bird.y = GYM_HEIGHT - 50 - 12;
            }
          });

          if (anyAlive) {
            pipes.forEach((p) => {
              p.x -= PIPE_SPEED;
              if (!p.passed && p.x + PIPE_WIDTH < BIRD_X) {
                p.passed = true;
                score++;
              }
            });

            if (pipes.length > 0 && pipes[0].x < -PIPE_WIDTH) {
              pipes.shift();
            }

            if (pipes.length > 0) {
              let lastPipe = pipes[pipes.length - 1];
              if (lastPipe.x < BACKEND_WIDTH) {
                spawnPipePair(lastPipe.x + PIPE_SPAWN_DIST);
              }
            }

            gameFrame++;

            if (!aiBird.dead && session) {
              let pastPipes = pipes.filter((p) => p.x + PIPE_WIDTH <= BIRD_X);
              let futurePipes = pipes.filter((p) => p.x + PIPE_WIDTH > BIRD_X);

              let lastP = pastPipes[pastPipes.length - 1] || {
                x: -200,
                top: 0,
                bottom: GYM_HEIGHT
              };
              let nextP = futurePipes[0] || {
                x: BACKEND_WIDTH,
                top: 0,
                bottom: GYM_HEIGHT
              };
              let next2P = futurePipes[1] || {
                x: BACKEND_WIDTH + 200,
                top: 0,
                bottom: GYM_HEIGHT
              };

              let state12D = [
                lastP.x,
                lastP.top,
                lastP.bottom,
                nextP.x,
                nextP.top,
                nextP.bottom,
                next2P.x,
                next2P.top,
                next2P.bottom,
                aiBird.y,
                aiBird.velocity,
                0.0
              ];

              const inputTensor = new ort.Tensor(
                "float32",
                Float32Array.from(state12D),
                [1, 12]
              );
              const outputMap = await session.run({ input: inputTensor });
              const qValues = outputMap.output.data;

              if (qValues[1] > qValues[0]) {
                aiBird.velocity = FLAP_IMPULSE;
              }
            }
          }
        }

        drawPipes();

        let anyAlive = !humanBird.dead || !aiBird.dead;
        let baseOffset =
          gameState === "PLAYING" && anyAlive
            ? -(gameFrame * PIPE_SPEED) % 24
            : 0;

        // Draw the primary collision floor where physics expect it, then tile downwards for tall screens
        for (let y = GYM_HEIGHT - 50; y < VISUAL_HEIGHT + 112; y += 112) {
          ctx.drawImage(baseImg, baseOffset, y, BACKEND_WIDTH + 24, 112);
        }

        let hoverY = gameState === "START" ? Math.sin(gameFrame * 0.1) * 6 : 0;
        let flapIndex = Math.floor(gameFrame / 5) % 4;

        if (aiBird.y < GYM_HEIGHT - 50 - 12 || !aiBird.dead) {
          let f =
            aiBird.dead || (gameState !== "PLAYING" && gameState !== "START")
              ? 1
              : flapIndex;
          ctx.globalAlpha = 0.5;
          drawSprite(
            blueBirdFrames[f],
            BIRD_X,
            aiBird.y + hoverY,
            aiBird.velocity
          );
          ctx.globalAlpha = 1.0;
        }

        if (humanBird.y < GYM_HEIGHT - 50 - 12 || !humanBird.dead) {
          let f =
            humanBird.dead || (gameState !== "PLAYING" && gameState !== "START")
              ? 1
              : flapIndex;
          drawSprite(
            yellowBirdFrames[f],
            BIRD_X,
            humanBird.y + hoverY,
            humanBird.velocity
          );
        }

        drawUI();
        requestAnimationFrame(gameLoop);
      }

      function drawSprite(img, x, y, velocity) {
        ctx.save();
        ctx.translate(x, y);
        let rotation =
          gameState === "START"
            ? 0
            : Math.min(Math.PI / 4, Math.max(-Math.PI / 4, velocity * 0.1));
        ctx.rotate(rotation);
        ctx.drawImage(img, -17, -12, 34, 24);
        ctx.restore();
      }

      function drawPipes() {
        pipes.forEach((p) => {
          ctx.save();
          ctx.translate(p.x + PIPE_WIDTH / 2, p.top);
          ctx.scale(1, -1);
          ctx.drawImage(pipeImg, -PIPE_WIDTH / 2, 0, PIPE_WIDTH, 320);
          ctx.restore();
          ctx.drawImage(pipeImg, p.x, p.bottom, PIPE_WIDTH, 320);
        });
      }

      function checkCollision(bird) {
        if (bird.y > GYM_HEIGHT - 50 - 12 || bird.y < 0) {
          bird.dead = true;
          return;
        }
        for (let p of pipes) {
          if (p.x < BIRD_X + 12 && p.x + PIPE_WIDTH > BIRD_X - 12) {
            if (bird.y - 12 < p.top || bird.y + 12 > p.bottom) {
              bird.dead = true;
            }
          }
        }
      }

      function drawUI() {
        ctx.textAlign = "center";
        ctx.lineJoin = "round";

        if (gameState === "START") {
          ctx.fillStyle = "white";
          ctx.strokeStyle = "black";
          ctx.lineWidth = 4;
          ctx.font = "bold 30px sans-serif";
          ctx.strokeText("TAP TO START", BACKEND_WIDTH / 2, 140);
          ctx.fillText("TAP TO START", BACKEND_WIDTH / 2, 140);

          ctx.fillStyle = "#64b5f6";
          ctx.lineWidth = 3;
          ctx.font = "bold 16px sans-serif";
          ctx.strokeText("Blue Bird = AI Bot", BACKEND_WIDTH / 2, 185);
          ctx.fillText("Blue Bird = AI Bot", BACKEND_WIDTH / 2, 185);
        } else if (gameState === "PLAYING") {
          ctx.fillStyle = "white";
          ctx.strokeStyle = "black";
          ctx.lineWidth = 4;
          ctx.font = "bold 40px sans-serif";
          ctx.strokeText(score, BACKEND_WIDTH / 2, 80);
          ctx.fillText(score, BACKEND_WIDTH / 2, 80);

          if (humanBird.dead) {
            ctx.font = "bold 40px sans-serif";
            ctx.strokeText("GAME OVER", BACKEND_WIDTH / 2, 180);
            ctx.fillText("GAME OVER", BACKEND_WIDTH / 2, 180);

            ctx.font = "bold 20px sans-serif";
            ctx.strokeText("Tap to Restart", BACKEND_WIDTH / 2, 230);
            ctx.fillText("Tap to Restart", BACKEND_WIDTH / 2, 230);
          }
        }
      }

      function handleInput() {
        if (gameState === "START") {
          gameState = "PLAYING";
          humanBird.velocity = FLAP_IMPULSE;
        } else if (gameState === "PLAYING") {
          if (!humanBird.dead) {
            humanBird.velocity = FLAP_IMPULSE;
          } else {
            resetGame();
            gameState = "START";
          }
        }
      }

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          handleInput();
        }
      });
      canvas.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          handleInput();
        },
        { passive: false }
      );
      canvas.addEventListener("mousedown", handleInput);

      initAI();
    </script>
  </body>
</html>
