<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Hackathon: Human vs Trained RL Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #222;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        background: #000;
        image-rendering: pixelated; /* Keeps pixel art sharp on large displays */
      }

      #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 24px;
        font-weight: bold;
        pointer-events: none;
        text-shadow: 2px 2px 0 #000;
      }
    </style>
  </head>
  <body>
    <div id="loader">Loading RL Brain...</div>
    <canvas id="gameCanvas"></canvas>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const loader = document.getElementById("loader");

      // --- SYSTEM ENGINE CONSTANTS ---
      const BACKEND_WIDTH = 288;
      const BACKEND_HEIGHT = 512;
      const GRAVITY = 0.4;
      const FLAP_IMPULSE = -7.0;
      const PIPE_SPEED = 3.0;
      const GAP_SIZE = 100;
      const PIPE_WIDTH = 52;
      const BIRD_X = 57;

      // --- HIGH-DPI SHARPNESS FIX ---
      const RESOLUTION_SCALE = 4;
      canvas.width = BACKEND_WIDTH * RESOLUTION_SCALE;
      canvas.height = BACKEND_HEIGHT * RESOLUTION_SCALE;
      ctx.scale(RESOLUTION_SCALE, RESOLUTION_SCALE);
      ctx.imageSmoothingEnabled = false;

      // --- ASSET LOADING (WITH ANIMATION CYCLES) ---
      const bgImg = new Image();
      bgImg.src = "assets/background-day.png";
      const pipeImg = new Image();
      pipeImg.src = "assets/pipe-green.png";
      const baseImg = new Image();
      baseImg.src = "assets/base.png";

      // Helper to load the 4-step animation sequence for a specific color
      function loadBirdFrames(color) {
        const down = new Image();
        down.src = `assets/${color}bird-downflap.png`;
        const mid = new Image();
        mid.src = `assets/${color}bird-midflap.png`;
        const up = new Image();
        up.src = `assets/${color}bird-upflap.png`;
        return [down, mid, up, mid]; // Natural cycle: Down -> Mid -> Up -> Mid
      }

      const yellowBirdFrames = loadBirdFrames("yellow");
      const blueBirdFrames = loadBirdFrames("blue");

      let session = null;
      let gameFrame = 0; // Universal frame counter for animations
      let score = 0;
      let pipes = [];
      let gameState = "LOADING";

      let humanBird = { y: 240, velocity: 0, dead: false };
      let aiBird = { y: 240, velocity: 0, dead: false };

      // 1. Initialize ONNX
      async function initAI() {
        try {
          session = await ort.InferenceSession.create(
            "./flappy_bird_packed.onnx"
          );
          loader.style.display = "none";
          gameState = "START";
          resetGame();
          requestAnimationFrame(gameLoop);
        } catch (e) {
          loader.innerText = "Error loading flappy_bird_packed.onnx";
          console.error("ONNX Runtime Error:", e);
        }
      }

      function resetGame() {
        score = 0;
        pipes = [];
        humanBird = { y: 240, velocity: 0, dead: false };
        aiBird = { y: 240, velocity: 0, dead: false };

        spawnPipePair(BACKEND_WIDTH + 100);
        spawnPipePair(BACKEND_WIDTH + 100 + BACKEND_WIDTH / 2 + PIPE_WIDTH / 2);
      }

      function spawnPipePair(startX) {
        let topHeight = Math.random() * (BACKEND_HEIGHT - GAP_SIZE - 160) + 60;
        pipes.push({
          x: startX,
          top: topHeight,
          bottom: topHeight + GAP_SIZE,
          passed: false
        });
      }

      // 2. The Core Execution Loop
      async function gameLoop() {
        ctx.clearRect(0, 0, BACKEND_WIDTH, BACKEND_HEIGHT);
        ctx.drawImage(bgImg, 0, 0, BACKEND_WIDTH, BACKEND_HEIGHT);

        // Global animation progression (unless both birds are dead)
        if (gameState !== "GAMEOVER") {
          gameFrame++;
        }

        if (gameState === "PLAYING") {
          // Update Physics
          if (!humanBird.dead) {
            humanBird.velocity += GRAVITY;
            humanBird.y += humanBird.velocity;
            checkCollision(humanBird);
          }
          if (!aiBird.dead) {
            aiBird.velocity += GRAVITY;
            aiBird.y += aiBird.velocity;
            checkCollision(aiBird);
          }

          // Move Pipes & Score Tracking
          pipes.forEach((p) => {
            p.x -= PIPE_SPEED;
            if (!p.passed && p.x + PIPE_WIDTH < BIRD_X) {
              p.passed = true;
              score++;
            }
          });

          // Pipe Cleanup & Spawning
          if (pipes.length > 0 && pipes[0].x < -PIPE_WIDTH) {
            pipes.shift();
            spawnPipePair(pipes[pipes.length - 1].x + 180);
          }

          // --- AI INFERENCE ENGINE ---
          if (!aiBird.dead && session) {
            let pastPipes = pipes.filter((p) => p.x + PIPE_WIDTH <= BIRD_X);
            let futurePipes = pipes.filter((p) => p.x + PIPE_WIDTH > BIRD_X);

            let lastP = pastPipes[pastPipes.length - 1] || {
              x: -200,
              top: 0,
              bottom: BACKEND_HEIGHT
            };
            let nextP = futurePipes[0] || {
              x: BACKEND_WIDTH,
              top: 0,
              bottom: BACKEND_HEIGHT
            };
            let next2P = futurePipes[1] || {
              x: BACKEND_WIDTH + 200,
              top: 0,
              bottom: BACKEND_HEIGHT
            };

            let state12D = [
              lastP.x,
              lastP.top,
              lastP.bottom,
              nextP.x,
              nextP.top,
              nextP.bottom,
              next2P.x,
              next2P.top,
              next2P.bottom,
              aiBird.y,
              aiBird.velocity,
              0.0
            ];

            const inputTensor = new ort.Tensor(
              "float32",
              Float32Array.from(state12D),
              [1, 12]
            );
            const outputMap = await session.run({ input: inputTensor });
            const qValues = outputMap.output.data;

            if (qValues[1] > qValues[0]) {
              aiBird.velocity = FLAP_IMPULSE;
            }
          }

          if (humanBird.dead && aiBird.dead) {
            gameState = "GAMEOVER";
          }
        }

        // --- GRAPHICAL RENDERING ---
        drawPipes();

        // Smooth scrolling floor effect
        let baseOffset =
          gameState !== "GAMEOVER" ? -(gameFrame * PIPE_SPEED) % 24 : 0;
        ctx.drawImage(
          baseImg,
          baseOffset,
          BACKEND_HEIGHT - 50,
          BACKEND_WIDTH + 24,
          112
        );

        // Calculate hover offsets and wing animations
        let hoverY = gameState === "START" ? Math.sin(gameFrame * 0.1) * 6 : 0;
        // Change animation frame every 5 game loops. Freeze on Midflap (1) if dead.
        let flapIndex = Math.floor(gameFrame / 5) % 4;

        // Render AI Bird (Blue / Ghosted)
        if (!aiBird.dead) {
          let frameIndex = gameState === "GAMEOVER" ? 1 : flapIndex;
          ctx.globalAlpha = 0.5; // Transparent
          drawSprite(
            blueBirdFrames[frameIndex],
            BIRD_X,
            aiBird.y + hoverY,
            aiBird.velocity
          );
          ctx.globalAlpha = 1.0;
        }

        // Render Human Bird (Yellow / Solid)
        if (!humanBird.dead) {
          let frameIndex = gameState === "GAMEOVER" ? 1 : flapIndex;
          drawSprite(
            yellowBirdFrames[frameIndex],
            BIRD_X,
            humanBird.y + hoverY,
            humanBird.velocity
          );
        }

        drawUI();

        requestAnimationFrame(gameLoop);
      }

      // --- SUBROUTINES ---
      function drawSprite(img, x, y, velocity) {
        ctx.save();
        ctx.translate(x, y);
        // Dynamic tilt based on velocity. If in START screen (velocity 0), remains flat.
        let rotation =
          gameState === "START"
            ? 0
            : Math.min(Math.PI / 4, Math.max(-Math.PI / 4, velocity * 0.1));
        ctx.rotate(rotation);
        ctx.drawImage(img, -17, -12, 34, 24);
        ctx.restore();
      }

      function drawPipes() {
        pipes.forEach((p) => {
          ctx.save();
          ctx.translate(p.x + PIPE_WIDTH / 2, p.top);
          ctx.scale(1, -1);
          ctx.drawImage(pipeImg, -PIPE_WIDTH / 2, 0, PIPE_WIDTH, 320);
          ctx.restore();
          ctx.drawImage(pipeImg, p.x, p.bottom, PIPE_WIDTH, 320);
        });
      }

      function checkCollision(bird) {
        if (bird.y > BACKEND_HEIGHT - 50 - 12 || bird.y < 0) {
          bird.dead = true;
          return;
        }
        for (let p of pipes) {
          if (p.x < BIRD_X + 12 && p.x + PIPE_WIDTH > BIRD_X - 12) {
            if (bird.y - 12 < p.top || bird.y + 12 > p.bottom) {
              bird.dead = true;
            }
          }
        }
      }

      function drawUI() {
        ctx.textAlign = "center";
        ctx.lineJoin = "round";

        if (gameState === "START") {
          ctx.fillStyle = "white";
          ctx.strokeStyle = "black";
          ctx.lineWidth = 4;
          ctx.font = "bold 30px sans-serif";
          ctx.strokeText("TAP TO START", BACKEND_WIDTH / 2, 140);
          ctx.fillText("TAP TO START", BACKEND_WIDTH / 2, 140);

          ctx.fillStyle = "#64b5f6";
          ctx.strokeStyle = "black";
          ctx.lineWidth = 3;
          ctx.font = "bold 16px sans-serif";
          ctx.strokeText("Blue Bird = AI Bot", BACKEND_WIDTH / 2, 185);
          ctx.fillText("Blue Bird = AI Bot", BACKEND_WIDTH / 2, 185);
        } else if (gameState === "PLAYING") {
          ctx.fillStyle = "white";
          ctx.strokeStyle = "black";
          ctx.lineWidth = 4;
          ctx.font = "bold 40px sans-serif";
          ctx.strokeText(score, BACKEND_WIDTH / 2, 80);
          ctx.fillText(score, BACKEND_WIDTH / 2, 80);
        } else if (gameState === "GAMEOVER") {
          ctx.fillStyle = "white";
          ctx.strokeStyle = "black";
          ctx.lineWidth = 4;
          ctx.font = "bold 40px sans-serif";
          ctx.strokeText("GAME OVER", BACKEND_WIDTH / 2, 150);
          ctx.fillText("GAME OVER", BACKEND_WIDTH / 2, 150);

          ctx.font = "bold 24px sans-serif";
          ctx.strokeText("Score: " + score, BACKEND_WIDTH / 2, 200);
          ctx.fillText("Score: " + score, BACKEND_WIDTH / 2, 200);

          ctx.font = "bold 20px sans-serif";
          ctx.strokeText("Tap to Restart", BACKEND_WIDTH / 2, 250);
          ctx.fillText("Tap to Restart", BACKEND_WIDTH / 2, 250);
        }
      }

      function handleInput() {
        if (gameState === "START") {
          gameState = "PLAYING";
          humanBird.velocity = FLAP_IMPULSE;
        } else if (gameState === "PLAYING" && !humanBird.dead) {
          humanBird.velocity = FLAP_IMPULSE;
        } else if (gameState === "GAMEOVER") {
          resetGame();
          gameState = "START";
        }
      }

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          handleInput();
        }
      });
      canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        handleInput();
      });
      canvas.addEventListener("mousedown", handleInput);

      initAI();
    </script>
  </body>
</html>
